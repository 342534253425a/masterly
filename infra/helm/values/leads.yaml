# Leads: заявки, ответы мастеров, контролируемое раскрытие контактов
nameOverride: leads
component: backend
image:
  repository: cr.yandex/masterly/leads
ports:
  grpc: 50054
  http: 0
env:
  KAFKA_BROKERS: "rc1a-kafka.mdb.yandexcloud.net:9091"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  LOG_LEVEL: "info"
  GRPC_SEARCH: "dns:///search-headless:50053"
  GRPC_CATALOG: "dns:///catalog-headless:50052"
  GRPC_IDENTITY: "dns:///identity-headless:50051"
resources:
  requests: { cpu: 500m, memory: 256Mi }
  limits: { memory: 512Mi }
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 30
networkPolicy:
  allowFrom: [gateway, reviews, messaging]
migrations:
  enabled: true
