# Identity: OTP, JWT EdDSA, ротация refresh-токенов
nameOverride: identity
component: backend
image:
  repository: cr.yandex/masterly/identity
ports:
  grpc: 50051
  http: 0
env:
  KAFKA_BROKERS: "rc1a-kafka.mdb.yandexcloud.net:9091"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  LOG_LEVEL: "info"
  JWT_ISSUER: "https://id.masterly.ru"
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 512Mi }
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
networkPolicy:
  # Сервисы-владельцы ПДн подтверждают исполнение удаления аккаунта (ADR-0011)
  allowFrom: [gateway, catalog, leads, reviews, messaging, notifications, media, analytics, trust]
migrations:
  enabled: true
