# Catalog: профили мастеров, услуги, цены (источник истины, outbox)
nameOverride: catalog
component: backend
image:
  repository: cr.yandex/masterly/catalog
ports:
  grpc: 50052
  http: 0
env:
  KAFKA_BROKERS: "rc1a-kafka.mdb.yandexcloud.net:9091"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
  LOG_LEVEL: "info"
  GRPC_IDENTITY: "dns:///identity-headless:50051"
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 512Mi }
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 24
networkPolicy:
  # notifications — адрес владельца мастерской для доставки уведомлений (GetMasterContacts)
  allowFrom: [gateway, search, leads, trust, notifications]
migrations:
  enabled: true
