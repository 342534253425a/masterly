global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Каждый сервис отдаёт /metrics (prom-client) на порту 9464
  - job_name: masterly-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:9464
          - identity:9464
          - catalog:9464
          - search:9464
          - leads:9464
          - reviews:9464
          - messaging:9464
          - notifications:9464
          - media:9464
          - analytics:9464
          - trust:9464
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
